  <!-- Top facet lines -->
  <line x1="172" y1="170" x2="88" y2="140" stroke="white" stroke-width="6" opacity="0.5"/>
  <line x1="340" y1="170" x2="424" y2="140" stroke="white" stroke-width="6" opacity="0.4"/>
  <line x1="172" y1="170" x2="256" y2="130" stroke="white" stroke-width="5" opacity="0.5"/>
  <line x1="340" y1="170" x2="256" y2="130" stroke="white" stroke-width="5" opacity="0.45"/>
  <line x1="172" y1="170" x2="340" y2="170" stroke="white" stroke-width="5" opacity="0.35"/>

  <!-- Side facet lines -->
  <line x1="172" y1="170" x2="172" y2="310" stroke="white" stroke-width="4" opacity="0.3"/>
  <line x1="340" y1="170" x2="340" y2="310" stroke="white" stroke-width="4" opacity="0.25"/>
  <line x1="88" y1="200" x2="172" y2="240" stroke="white" stroke-width="4" opacity="0.35"/>
  <line x1="424" y1="200" x2="340" y2="240" stroke="white" stroke-width="4" opacity="0.3"/>
  <line x1="88" y1="340" x2="172" y2="310" stroke="white" stroke-width="4" opacity="0.35"/>
  <line x1="424" y1="340" x2="340" y2="310" stroke="white" stroke-width="4" opacity="0.3"/>
  <line x1="256" y1="130" x2="256" y2="350" stroke="white" stroke-width="4" opacity="0.25"/>
  <line x1="172" y1="240" x2="172" y2="310" stroke="white" stroke-width="3" opacity="0.2"/>
  <line x1="340" y1="240" x2="340" y2="310" stroke="white" stroke-width="3" opacity="0.2"/>
  <line x1="172" y1="310" x2="256" y2="350" stroke="white" stroke-width="4" opacity="0.3"/>
  <line x1="340" y1="310" x2="256" y2="350" stroke="white" stroke-width="4" opacity="0.25"/>

  <!-- Letter J -->
  <path d="M286,240 L286,320 C286,358 268,376 244,376 C218,376 200,356 196,328
