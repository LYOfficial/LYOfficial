<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hexagonal gem shape (emerald cut) -->
  <polygon points="256,48 424,140 424,340 256,432 88,340 88,140" fill="#111111"/>

  <!-- Top facet -->
  <polygon points="256,48 424,140 340,170 256,130 172,170 88,140" fill="#1a1a1a"/>

  <!-- Left top facet -->
  <polygon points="88,140 172,170 172,240 88,200" fill="#161616"/>

  <!-- Right top facet -->
  <polygon points="424,140 340,170 340,240 424,200" fill="#141414"/>

  <!-- Left facet -->
  <polygon points="88,200 172,240 172,310 88,340" fill="#0d0d0d"/>

  <!-- Right facet -->
  <polygon points="424,200 340,240 340,310 424,340" fill="#0f0f0f"/>

  <!-- Bottom left facet -->
  <polygon points="88,340 172,310 256,350 256,432" fill="#0a0a0a"/>

