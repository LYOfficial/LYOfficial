<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">vUSTB 生态数据流</title>
  <desc id="desc">用户、USTBL、vBot、Jewel 与 AnyshareCLI 围绕 vUSTB 官网进行认证、查询、部署、发布同步和云盘传输。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111d36"/><stop offset="1" stop-color="#1a3551"/></linearGradient>
    <linearGradient id="core" x2="1" y2="1"><stop stop-color="#1d7196"/><stop offset="1" stop-color="#245780"/></linearGradient>
    <marker id="blueArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#a5def0"/></marker>
    <marker id="goldArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#e6c27d"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#bg)" stroke="#42627e"/>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="34" y="30" fill="#b6eaff" font-size="16" font-weight="700" letter-spacing="2">vUSTB · DATA FLOW</text>
    <text x="1165" y="30" fill="#8faec3" font-size="12" text-anchor="end">官网为核心的完整协作链路</text>
    <g font-size="12" fill="#eaf8ff" text-anchor="middle">
      <rect x="20" y="58" width="136" height="52" rx="9" fill="#554772" stroke="#a88fd1"/><text x="88" y="80" font-size="16" font-weight="700">USTBL</text><text x="88" y="98">OAuth 登录 · 角色/实例</text>
      <rect x="20" y="124" width="136" height="52" rx="9" fill="#70445d" stroke="#d18baa"/><text x="88" y="146" font-size="16" font-weight="700">vBot</text><text x="88" y="164">QQ 指令 · 实时查询</text>
      <rect x="20" y="190" width="136" height="52" rx="9" fill="#365b68" stroke="#7fbaca"/><text x="88" y="212" font-size="16" font-weight="700">用户 / 管理员</text><text x="88" y="230">Web · 内容 · 后台</text>
    </g>
    <rect x="190" y="50" width="205" height="202" rx="13" fill="url(#core)" stroke="#9ce6ff" stroke-width="2"/>
    <g fill="#eaf8ff" text-anchor="middle"><text x="292" y="82" font-size="26" font-weight="700">vUSTB</text><image href="https://raw.githubusercontent.com/LYOfficial/LYOfficial/main/assets/vustb-logo.webp" x="350" y="61" width="32" height="32" preserveAspectRatio="xMidYMid meet"/><text x="292" y="103" font-size="12" fill="#c7efff">Next.js + FastAPI</text><path d="M212 116H373" stroke="#8ecde6" stroke-opacity=".55"/><text x="292" y="137" font-size="14" font-weight="700">入口与协议层</text><text x="292" y="155" font-size="12">Web / REST API / OAuth</text><text x="292" y="172" font-size="12">Yggdrasil / CustomSkinAPI</text><text x="292" y="189" font-size="12">OpenID / Device Flow</text><path d="M212 202H373" stroke="#8ecde6" stroke-opacity=".55"/><text x="292" y="222" font-size="14" font-weight="700">业务与数据层</text><text x="292" y="240" font-size="12">账户 · 皮肤 · 服务器 · 打印 · 书籍</text></g>
    <g font-size="12" fill="#eaf8ff" text-anchor="middle"><rect x="430" y="57" width="150" height="55" rx="9" fill="#315777" stroke="#82b7d5"/><text x="505" y="80" font-size="16" font-weight="700">PostgreSQL</text><text x="505" y="98">账户 / 内容 / 配置</text><rect x="430" y="123" width="150" height="55" rx="9" fill="#315777" stroke="#82b7d5"/><text x="505" y="146" font-size="16" font-weight="700">Redis + Celery</text><text x="505" y="164">缓存 / 异步任务</text><rect x="430" y="189" width="150" height="55" rx="9" fill="#315777" stroke="#82b7d5"/><text x="505" y="212" font-size="16" font-weight="700">Caddy 网关</text><text x="505" y="230">HTTPS / 路由 / 静态文件</text></g>
    <g font-size="12" fill="#fff8ed" text-anchor="middle"><rect x="618" y="57" width="180" height="80" rx="11" fill="#68533a" stroke="#e0b878"/><text x="708" y="82" font-size="18" font-weight="700">Jewel</text><text x="708" y="102">Git → Compose 部署</text><text x="708" y="120">备份 · 日志 · 资源统计</text><rect x="618" y="157" width="180" height="80" rx="11" fill="#68533a" stroke="#e0b878"/><text x="708" y="182" font-size="18" font-weight="700">AnyshareCLI</text><text x="708" y="202">列出 / 上传 / 下载</text><text x="708" y="220">USTBL 发布文件云盘镜像</text></g>
    <g font-size="12" fill="#eaf8ff" text-anchor="middle"><rect x="835" y="57" width="165" height="55" rx="9" fill="#365d54" stroke="#8cd4b9"/><text x="917" y="80" font-size="16" font-weight="700">Docker 主机</text><text x="917" y="98">vUSTB Compose 项目</text><rect x="835" y="123" width="165" height="55" rx="9" fill="#365d54" stroke="#8cd4b9"/><text x="917" y="146" font-size="16" font-weight="700">QQ / Minecraft</text><text x="917" y="164">玩家与群聊触点</text><rect x="835" y="189" width="165" height="55" rx="9" fill="#365d54" stroke="#8cd4b9"/><text x="917" y="212" font-size="16" font-weight="700">北科云盘</text><text x="917" y="230">Release / 资源镜像</text></g>
    <g font-size="12" fill="#d8f7ff" text-anchor="middle"><rect x="1030" y="57" width="150" height="55" rx="9" fill="#294b68" stroke="#73b9dd"/><text x="1105" y="80" font-size="15" font-weight="700">认证与同步</text><text x="1105" y="98">Token · 角色 · 实例</text><rect x="1030" y="123" width="150" height="55" rx="9" fill="#294b68" stroke="#73b9dd"/><text x="1105" y="146" font-size="15" font-weight="700">查询与展示</text><text x="1105" y="164">状态 · 打印 · 知识库</text><rect x="1030" y="189" width="150" height="55" rx="9" fill="#294b68" stroke="#73b9dd"/><text x="1105" y="212" font-size="15" font-weight="700">发布与下载</text><text x="1105" y="230">GitHub / 镜像 / 云盘</text></g>
    <g fill="none" stroke="#a5def0" stroke-width="2" marker-end="url(#blueArrow)"><path d="M156 84H190"/><path d="M156 150H190"/><path d="M156 216H190"/><path d="M395 84H430"/><path d="M395 150H430"/><path d="M395 216H430"/><path d="M580 84H618"/><path d="M580 150H618"/><path d="M580 216H618"/><path d="M798 84H835"/><path d="M798 150H835"/><path d="M798 216H835"/><path d="M1000 84H1030"/><path d="M1000 150H1030"/><path d="M1000 216H1030"/></g>
    <g fill="none" stroke="#e6c27d" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#goldArrow)"><path d="M292 50V39H708V57"/><path d="M708 137V157"/><path d="M798 197H817V216H835"/><path d="M917 112V123"/></g>
  </g>
